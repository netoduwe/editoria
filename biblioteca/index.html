<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Editor IA · Biblioteca</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141713'/%3E%3Cpath d='M9 8h14M9 16h10M9 24h14' stroke='%23d1ff61' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="biblioteca.css">
</head>
<body>
<div class="wrap">
<header class="header">
  <a class="brand" href="/" aria-label="Editor IA, biblioteca"><svg class="mark" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M8 8h20M8 18h14M8 28h20" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="28" cy="18" r="2.5" fill="currentColor"/></svg><div><strong>EDITOR-IA</strong><small>BIBLIOTECA</small></div></a>
  <div class="top-right">
    <a class="author" href="https://www.instagram.com/duweneto/" target="_blank" rel="noopener noreferrer" aria-label="@duweneto no Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/></svg>@duweneto<svg class="external-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg></a>
    <details class="library-menu"><summary aria-label="Opções da biblioteca"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary><div class="menu-panel"><button data-nova-pasta="">Nova pasta</button><button data-acao="ajuda">Como usar a biblioteca</button></div></details>
  </div>
</header>
<section class="hero" aria-labelledby="titulo-pagina">
  <div><h1 id="titulo-pagina">Biblioteca de referências</h1><p>Edição, motion e os seus projetos, num lugar só.</p></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input type="search" id="busca" placeholder="Buscar na biblioteca…" aria-label="Buscar na biblioteca"></div>
</section>
<nav class="toolbar" aria-label="Pastas da biblioteca"><div class="tabs" id="abas"></div><div class="tools"><select id="vista" aria-label="O que mostrar"><option value="ativos">Minha biblioteca</option><option value="removidos">Removidos e lixeira</option></select><button id="filtros-botao" aria-expanded="false" aria-controls="filtros"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2" fill="var(--bg)"/><circle cx="13" cy="14" r="2" fill="var(--bg)"/></svg>Filtros</button><select id="ordem" aria-label="Ordenar"><option value="destaque">Em destaque</option><option value="nome">Nome A–Z</option><option value="curtos">Mais curtos</option></select></div></nav>
<section class="filtros" id="filtros" aria-label="Filtros" hidden></section>
<main><div class="feed-head"><span id="contagem" aria-live="polite"></span><span class="feed-actions" id="acoes-da-aba"></span></div><div class="grid" id="grade"></div><div class="load-row"><button id="mais" hidden>Carregar mais</button></div></main>
<footer class="footer"><span>Suas pastas, avaliações e itens removidos ficam só neste computador.</span><span id="rodape"></span></footer>
</div>
<dialog id="detalhes" aria-labelledby="detalhes-titulo"><div class="detail-head"><h2 id="detalhes-titulo"></h2><button class="close" data-fechar="detalhes" aria-label="Fechar">×</button></div><div class="detail-body" id="detalhes-corpo"></div></dialog>
<dialog id="caixa" aria-labelledby="caixa-titulo"><form method="dialog" class="caixa"><h2 id="caixa-titulo"></h2><div id="caixa-texto" class="caixa-texto"></div><input id="caixa-campo" maxlength="40" autocomplete="off"><label class="check" id="caixa-opcao"><input type="checkbox" id="caixa-marcado"><span></span></label><div class="caixa-botoes"><button value="cancelar" formnovalidate>Cancelar</button><button value="ok" id="caixa-ok" class="primary">Confirmar</button></div></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script id="boot" type="application/json">/*__BOOT__*/</script>
<script src="app.js"></script>
</body>
</html>
